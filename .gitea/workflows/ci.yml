name: ci

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  backpressure:
    runs-on: ubuntu-latest
    steps:
      - name: Install CI dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ripgrep

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: fmt
        run: ./bin/fmt.sh

      - name: lint
        run: ./bin/lint.sh

      - name: test
        run: ./bin/test.sh

      - name: review-policy
        run: ./bin/review_policy.sh

      - name: pr-policy
        run: ./bin/pr_policy.sh

  release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: backpressure
    steps:
      - name: Install release dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve semantic version
        id: version
        run: |
          version="$(bash ./bin/semantic_version.sh next)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create and push version tag
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag already exists: ${tag}"
            exit 0
          fi
          git tag "${tag}"
          git push origin "${tag}"

      - name: Build release artifact
        id: artifact
        run: |
          artifact_path="$(bash ./bin/build_artifact.sh --version "${{ steps.version.outputs.version }}")"
          echo "artifact_path=${artifact_path}" >> "${GITHUB_OUTPUT}"

      # The artifact-service path is unreliable here (job containers cannot
      # reach the public ROOT_URL); publish a proper Gitea release instead.
      - name: Publish Gitea release with artifact
        run: |
          # Job containers run on the compose network: reach Gitea by service
          # name, not by the public ROOT_URL (localhost is the container itself).
          api="http://gitea:3000/api/v1"
          repo="${GITHUB_REPOSITORY}"
          tag="v${{ steps.version.outputs.version }}"
          auth="Authorization: token ${{ secrets.GITHUB_TOKEN }}"

          release_id="$(curl -fsS -H "${auth}" "${api}/repos/${repo}/releases/tags/${tag}" 2>/dev/null \
            | sed -n 's/.*"id":[[:space:]]*\([0-9]*\).*/\1/p' | head -1 || true)"
          if [ -z "${release_id}" ]; then
            release_id="$(curl -fsS -X POST -H "${auth}" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${tag}\",\"name\":\"${tag}\"}" \
              "${api}/repos/${repo}/releases" \
              | sed -n 's/.*"id":[[:space:]]*\([0-9]*\).*/\1/p' | head -1)"
          fi

          artifact="${{ steps.artifact.outputs.artifact_path }}"
          curl -fsS -X POST -H "${auth}" \
            -F "attachment=@${artifact}" \
            "${api}/repos/${repo}/releases/${release_id}/assets?name=$(basename "${artifact}")" \
            >/dev/null
          echo "Release ${tag} published with $(basename "${artifact}")"
