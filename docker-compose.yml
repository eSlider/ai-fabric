x-go-service-base: &go-service-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      - BUILDKIT_INLINE_CACHE=1
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  restart: unless-stopped
  network_mode: host
  volumes:
    - .:/workspace
    - ./bin/issue-handler:/usr/local/bin/issue-handler:ro
    - ./bin/tg-bot:/usr/local/bin/tg-bot:ro
    - "${CURSOR_AGENT_HOME_DIR:-${HOME}/.local/share/cursor-agent}:/usr/local/share/cursor-agent:ro"
    - "${CURSOR_SETTINGS_DIR:-${HOME}/.cursor}:/workspace/.cursor"
    # cursor-agent CLI credentials (auth.json) live in XDG config dir
    - "${CURSOR_CONFIG_DIR:-${HOME}/.config/cursor}:/workspace/.config/cursor"
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    gitea:
      condition: service_healthy
  env_file:
    - .env
  environment:
    - HOME=/workspace
  develop:
    watch:
      - action: rebuild
        path: ./cmd
      - action: rebuild
        path: ./pkg
      - action: rebuild
        path: ./internal
      - action: rebuild
        path: ./go.mod
      - action: rebuild
        path: ./go.sum
      - action: rebuild
        path: ./Dockerfile
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      labels: "service"

services:
  gitea:
    image: docker.gitea.com/gitea:1.24.6
    container_name: ai-fabric-gitea
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Allow webhooks to reach the issue-handler on the docker host.
      GITEA__webhook__ALLOWED_HOST_LIST: "loopback,private,host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - ./var/gitea:/data
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20

  gitea-runner:
    image: docker.io/gitea/act_runner:0.3.0
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CONFIG_FILE: "${CONFIG_FILE:-/tmp/runner/config.yaml}"
      GITEA_INSTANCE_URL: "${GITEA_INSTANCE_URL:-http://gitea:3000}"
      GITEA_RUNNER_NAME: "${GITEA_RUNNER_NAME:-ai-fabric-runner}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./bin/gitea-runner-command.sh:/usr/local/bin/gitea-runner-command.sh:ro
      # Persist runner registration across container recreation.
      - ./var/runner-1:/tmp/runner
    entrypoint: ["/bin/sh", "/usr/local/bin/gitea-runner-command.sh"]

  gitea-mcp:
    image: docker.gitea.com/gitea-mcp-server:latest
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    command: ["/app/gitea-mcp", "-t", "http", "-p", "8080"]

  issue-handler:
    # Runs with host networking (see base); the webhook server listens on host port 8082.
    <<: *go-service-base
    command: ["issue-handler"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "service=issue-handler"

  tg-bot:
    <<: *go-service-base
    command: ["tg-bot"]
    labels:
      - "service=tg-bot"
